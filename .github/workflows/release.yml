name: release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write
  issues: read

# Never cancel a release mid-publish; let an in-flight run finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # tagpr maintains the release PR; merging it tags the next version.
      # `tag` output is set only on the run that actually creates a tag.
      - id: tagpr
        uses: Songmu/tagpr@e84001bd5dac8defa0c75b3913937d284a3b3660 # v1.20.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # When a tag was just created, build and publish in the same run. Keeping
      # this in one workflow avoids needing a PAT to trigger a separate one
      # (events from GITHUB_TOKEN don't start new workflow runs).
      - if: steps.tagpr.outputs.tag != ''
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - if: steps.tagpr.outputs.tag != ''
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with write access to mi-wada/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
